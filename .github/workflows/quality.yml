name: Engineering quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quality on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RUN_DOTNET_INTEGRATION: '1'
    steps:
      - name: Prepare Windows checkout for vendored paths and LF fixtures
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run workspace:check -- --before-install
      - run: npm ci
      - name: Check production dependencies for high and critical advisories
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run quality
      - run: npm run coverage:core
        if: runner.os == 'Linux'
      - name: Package and verify the versioned extension
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:package
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: recast-${{ github.ref_name }}-${{ runner.os }}
          path: apps/vscode-extension/dist/recast.vsix
          if-no-files-found: error

  required:
    name: Repository quality
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both platforms to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
